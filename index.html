<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriveSite Builder v2 - Busca e Tags</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
.font-serif-display{font-family:"Instrument Serif",serif}
.font-serif-text{font-family:"Newsreader",serif}
*{scrollbar-width:thin}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#e7e2d8;border-radius:10px}
</style>
</head>
<body class="bg-[#fbf9f5] text-[#121210] antialiased">
<div id="app"></div>

<script>
const STORAGE_KEY='drivesite_v2_busca_tags';
const defaultData={
  siteTitle:'Seu título',
  siteDesc:'Descrição do site aparece aqui. Clique em configurar para editar.',
  posts:[
    {id:'1', date:new Date().toISOString(), title:'Primeira postagem no meu site do Drive', text:'Escreva várias postagens aqui, depois clique em Envie para o Drive. O arquivo final para o Drive é sempre o index.html.\n\nDica: use tags para organizar. Ex: #viagem #trabalho #pessoal', tags:['boas-vindas','tutorial'], photos:[]}
  ]
};

function load(){ try{ const raw=localStorage.getItem(STORAGE_KEY); return raw?JSON.parse(raw):structuredClone(defaultData);}catch{return structuredClone(defaultData)}}
function save(d){ localStorage.setItem(STORAGE_KEY, JSON.stringify(d));}
function fmtDate(iso){ try{ const dt=new Date(iso); return dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}catch{return ''}}
function uid(){ return Math.random().toString(36).slice(2,9)}

let state = load();
let editingId = null;
let searchTerm = '';
let selectedTag = '';
let showConfig = false;

function allTags(){
  const m=new Map();
  state.posts.forEach(p=> (p.tags||[]).forEach(t=>{ const k=t.toLowerCase(); m.set(k,{name:t,count:(m.get(k)?.count||0)+1}) }));
  return [...m.values()].sort((a,b)=>b.count-a.count);
}
function matches(p, term){
  if(!term) return true;
  const t=term.toLowerCase();
  return (p.title||'').toLowerCase().includes(t) || (p.text||'').toLowerCase().includes(t) || (p.tags||[]).join(' ').toLowerCase().includes(t) || (p.photos||[]).some(ph=> (ph.caption||'').toLowerCase().includes(t));
}
function filteredPosts(){
  let list=[...state.posts];
  if(selectedTag) list=list.filter(p=> (p.tags||[]).some(x=> x.toLowerCase()===selectedTag.toLowerCase()));
  if(searchTerm) list=list.filter(p=> matches(p, searchTerm));
  return list.sort((a,b)=> new Date(b.date)-new Date(a.date));
}

function exportDriveHtml(){
  const postsJson = JSON.stringify(state.posts);
  const titleEsc = state.siteTitle.replace(/</g,'&lt;');
  const descEsc = state.siteDesc.replace(/</g,'&lt;');
  return `<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${titleEsc}</title>
<script src="https://cdn.tailwindcss.com"><\/script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>.font-serif-display{font-family:"Instrument Serif",serif}.font-serif-text{font-family:"Newsreader",serif}</style>
</head><body class="bg-[#fbf9f5] text-[#121210]">
<div class="max-w-[760px] mx-auto px-6 sm:px-10 py-12">
  <div class="mb-6">
    <div class="relative">
      <input id="driveSearch" placeholder="Buscar postagem..." class="w-full h-[48px] pl-11 pr-4 rounded-[14px] border border-[#ece8df] bg-white text-[14px] outline-none focus:border-[#121210]">
      <span class="absolute left-4 top-1/2 -translate-y-1/2 opacity-50">🔍</span>
    </div>
    <div id="driveTags" class="mt-3 flex flex-wrap gap-2"></div>
    <div id="driveCounter" class="mt-2 text-[11px] text-[#8b897f]"></div>
  </div>
  <header class="mb-16 border-b border-[#ece8df] pb-10">
    <h1 class="font-serif-display text-[48px] sm:text-[64px] leading-[0.9] tracking-[-0.04em]">${titleEsc}</h1>
    <p class="font-serif-text text-[18px] leading-[1.5] text-[#6a6863] mt-6">${descEsc}</p>
  </header>
  <div id="driveList"></div>
  <footer class="mt-20 pt-8 border-t border-[#ece8df] text-[11px] text-[#8b897f]">Feito com DriveSite Builder v2 — com Busca e Tags • ${new Date().getFullYear()}</footer>
</div>
<script>
const POSTS=${postsJson};
let sTerm=''; let sTag='';
function fmt(iso){ try{ return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}catch{return ''}}
function allTags(){ const m=new Map(); POSTS.forEach(p=> (p.tags||[]).forEach(t=>{ const k=t.toLowerCase(); m.set(k,{name:t,count:(m.get(k)?.count||0)+1}) })); return [...m.values()].sort((a,b)=>b.count-a.count); }
function matches(p, term){ if(!term) return true; const t=term.toLowerCase(); return (p.title||'').toLowerCase().includes(t) || (p.text||'').toLowerCase().includes(t) || (p.tags||[]).join(' ').toLowerCase().includes(t); }
function render(){
  const listEl=document.getElementById('driveList');
  const counter=document.getElementById('driveCounter');
  const tagsEl=document.getElementById('driveTags');
  const tags=allTags();
  tagsEl.innerHTML=tags.map(t=> \`<button onclick="toggleTag('\${t.name}')" class="px-3 py-1 rounded-full text-[11px] border \${sTag.toLowerCase()===t.name.toLowerCase()?'bg-[#121210] text-white border-[#121210]':'bg-white border-[#ece8df] text-[#6a6863]'}">\${t.name} (\${t.count})</button>\`).join('') + (sTag?'<button onclick="toggleTag(\'\')" class="ml-2 text-[11px] underline">limpar</button>':'');
  let filtered=[...POSTS];
  if(sTag) filtered=filtered.filter(p=> (p.tags||[]).some(x=> x.toLowerCase()===sTag.toLowerCase()));
  if(sTerm) filtered=filtered.filter(p=> matches(p,sTerm));
  filtered.sort((a,b)=> new Date(b.date)-new Date(a.date));
  counter.textContent = sTerm||sTag ? \`\${filtered.length} de \${POSTS.length} postagens\` : \`\${POSTS.length} postagens\`;
  if(filtered.length===0){ listEl.innerHTML='<div class="py-20 text-center text-[#8b897f]">Nenhuma postagem encontrada para "'+(sTerm||sTag)+'"</div>'; return; }
  listEl.innerHTML=filtered.map(p=> \`
    <article class="mb-20 pb-16 border-b border-[#ece8df]">
      <div class="text-[11px] tracking-[0.16em] uppercase text-[#8b897f] mb-3">\${fmt(p.date)}</div>
      <h2 class="font-serif-display text-[32px] sm:text-[42px] leading-[0.98] mb-5">\${(p.title||'Sem título')}</h2>
      <div class="font-serif-text text-[17px] leading-[1.8] whitespace-pre-wrap">\${(p.text||'')}</div>
      \${(p.tags&&p.tags.length)?'<div class="mt-5 flex flex-wrap gap-2">'+p.tags.map(t=>'<span class="px-2.5 py-1 rounded-full bg-[#f4f1eb] text-[11px]">#'+t+'</span>').join('')+'</div>':''}
      \${(p.photos&&p.photos.length)?'<div class="mt-8 grid gap-3 '+(p.photos.length===1?'grid-cols-1':p.photos.length===2?'grid-cols-2':'grid-cols-3')+'">'+p.photos.map(ph=>'<figure class="m-0"><div class="overflow-hidden rounded-[12px] bg-[#f4f1eb] aspect-[4/3]"><img src="'+ph.dataUrl+'" class="w-full h-full object-cover"></div>'+(ph.caption?'<figcaption class="mt-2 text-[12px] text-[#8b897f]">'+ph.caption+'</figcaption>':'')+'</figure>').join('')+'</div>':''}
    </article>\`).join('');
}
function toggleTag(t){ sTag = sTag.toLowerCase()===t.toLowerCase()?'':t; render(); }
document.getElementById('driveSearch').addEventListener('input', e=>{ sTerm=e.target.value; render(); });
render();
<\/script>
</body></html>`;
}

function renderApp(){
  const app=document.getElementById('app');
  const tags=allTags();
  const filtered=filteredPosts();
  const editing = editingId ? state.posts.find(p=>p.id===editingId) : null;

  app.innerHTML = `
  <div class="min-h-screen flex flex-col lg:flex-row">
    <!-- EDITOR -->
    <div class="w-full lg:w-[420px] lg:shrink-0 bg-white lg:border-r border-[#ece8df] flex flex-col h-auto lg:h-screen lg:sticky top-0">
      <div class="h-[56px] border-b border-[#ece8df] flex items-center justify-between px-5">
        <div class="flex items-center gap-2">
          <div class="h-7 w-7 rounded-full bg-[#121210] text-white grid place-items-center text-[12px] font-bold">DS</div>
          <span class="text-[12px] tracking-[0.12em] uppercase font-medium">Builder v2 • Busca e Tags</span>
        </div>
        <button id="btnConfig" class="text-[11px] tracking-[0.08em] uppercase border border-[#ece8df] rounded-full px-3 py-1 hover:bg-[#fbf9f5]">Config</button>
      </div>

      <div class="p-5 flex-1 overflow-auto">
        ${showConfig ? `
          <div class="mb-6 p-4 rounded-[14px] bg-[#fbf9f5] border border-[#ece8df]">
            <label class="text-[11px] uppercase tracking-[0.1em] text-[#8b897f]">Título do site</label>
            <input id="siteTitle" value="${state.siteTitle.replace(/"/g,'&quot;')}" class="mt-1 w-full h-[40px] px-3 rounded-[10px] border border-[#ece8df] bg-white text-[14px] outline-none">
            <label class="mt-3 block text-[11px] uppercase tracking-[0.1em] text-[#8b897f]">Descrição</label>
            <textarea id="siteDesc" class="mt-1 w-full min-h-[70px] p-3 rounded-[10px] border border-[#ece8df] bg-white text-[14px] outline-none resize-none">${state.siteDesc}</textarea>
            <button id="saveConfig" class="mt-3 w-full h-[40px] rounded-[10px] bg-[#121210] text-white text-[13px]">Salvar</button>
          </div>
        `:''}

        <div class="flex gap-2 mb-3">
          <button id="btnNew" class="flex-1 h-[44px] rounded-[12px] bg-[#121210] text-white text-[13px] font-medium">+ Nova postagem</button>
          <button id="btnExport" class="h-[44px] px-4 rounded-[12px] bg-[#121210] text-white text-[12px] font-medium flex items-center gap-1.5"><span>⬇</span> index.html</button>
        </div>

        <div class="grid grid-cols-3 gap-2 mb-4">
          <button id="btnBackup" class="h-[36px] rounded-[10px] border border-[#ece8df] bg-[#f4f1eb] text-[11px] uppercase tracking-[0.06em] font-medium">backup.json</button>
          <label class="h-[36px] rounded-[10px] border border-[#ece8df] text-[11px] uppercase tracking-[0.06em] grid place-items-center cursor-pointer hover:bg-[#fbf9f5]">Importar
            <input id="importFile" type="file" accept=".json" class="hidden">
          </label>
          <div class="h-[36px] rounded-[10px] bg-[#e8f5e9] border border-[#a5d6a7] text-[10px] tracking-[0.06em] uppercase text-[#1b5e20] grid place-items-center font-bold px-1 text-center">Arquivo único</div>
        </div>
        
        <div class="mb-4 p-3 rounded-[12px] bg-[#fff8e1] border border-[#ffe082] text-[11px] leading-[1.5] text-[#6d4c00]">
          <strong>Para o Drive:</strong> clique em <span class="bg-[#121210] text-white px-1.5 py-0.5 rounded text-[10px]">⬇ index.html</span> e envie pro Drive. Mantenha o mesmo File ID ao atualizar.
        </div>

        <!-- BUSCA EDITOR -->
        <div class="relative mb-3">
          <input id="searchInput" value="${searchTerm.replace(/"/g,'&quot;')}" placeholder="Buscar postagem por título, texto ou tag..." class="w-full h-[42px] pl-10 pr-8 rounded-[12px] border border-[#ece8df] bg-[#fbf9f5] text-[13px] outline-none focus:border-[#121210] focus:bg-white">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[14px] opacity-60">🔍</span>
          ${searchTerm?'<button id="clearSearch" class="absolute right-3 top-1/2 -translate-y-1/2 h-5 w-5 rounded-full bg-[#ece8df] grid place-items-center text-[10px]">✕</button>':''}
        </div>
        ${selectedTag?`<div class="mb-3 flex items-center gap-2 text-[11px]"><span class="px-2.5 py-1 rounded-full bg-[#121210] text-white">#${selectedTag}</span><button id="clearTag" class="underline text-[#8b897f]">limpar filtro</button></div>`:''}
        <div class="mb-4 text-[11px] text-[#8b897f]">${searchTerm||selectedTag?`${filtered.length} de ${state.posts.length} • ` : ''}${state.posts.length} postagens • ${tags.length} tags</div>

        ${editing ? `
        <div class="mb-6 p-4 rounded-[16px] border border-[#121210] bg-[#fffefb] shadow-sm">
          <div class="flex justify-between items-center mb-3">
            <span class="text-[11px] uppercase tracking-[0.12em] font-medium">${editingId?'Editando':'Nova'}</span>
            <button id="cancelEdit" class="text-[11px] underline">cancelar</button>
          </div>
          <input id="postTitle" placeholder="Título da postagem" value="${(editing.title||'').replace(/"/g,'&quot;')}" class="w-full h-[42px] px-3 rounded-[10px] border border-[#ece8df] text-[14px] font-medium outline-none mb-2">
          <textarea id="postText" placeholder="Escreva o texto aqui..." class="w-full min-h-[120px] p-3 rounded-[10px] border border-[#ece8df] text-[14px] leading-[1.6] outline-none resize-none">${editing.text||''}</textarea>

          <!-- TAGS INPUT -->
          <div class="mt-3">
            <label class="text-[11px] uppercase tracking-[0.08em] text-[#8b897f]">Tags da postagem</label>
            <div id="editTagsChips" class="mt-1.5 flex flex-wrap gap-1.5">${(editing.tags||[]).map(t=>`<span class="group flex items-center gap-1 px-2.5 py-1 rounded-full bg-[#f4f1eb] border border-[#ece8df] text-[12px]"><span>#${t}</span><button data-removetag="${t}" class="h-4 w-4 rounded-full bg-[#ece8df] grid place-items-center text-[9px]">✕</button></span>`).join('')}</div>
            <div class="mt-2 flex gap-2">
              <input id="tagInput" placeholder="Adicionar tag + Enter" class="flex-1 h-[36px] px-3 rounded-[10px] border border-[#ece8df] text-[13px] outline-none">
              <button id="addTagBtn" class="h-[36px] px-3 rounded-[10px] bg-[#121210] text-white text-[12px]">Add</button>
            </div>
            ${tags.length?`<div class="mt-2 flex flex-wrap gap-1.5">${tags.slice(0,12).map(t=>`<button data-suggest="${t.name}" class="px-2 py-1 rounded-full bg-white border border-dashed border-[#ece8df] text-[11px] text-[#8b897f] hover:border-[#121210]">#${t.name} (${t.count})</button>`).join('')}</div>`:''}
          </div>

          <div class="mt-3">
            <label class="text-[11px] uppercase tracking-[0.08em] text-[#8b897f]">Fotos</label>
            <div id="editPhotos" class="mt-2 grid grid-cols-3 gap-2">${(editing.photos||[]).map(ph=>`<div class="relative rounded-[10px] overflow-hidden bg-[#f4f1eb] aspect-square"><img src="${ph.dataUrl}" class="w-full h-full object-cover"><button data-removephoto="${ph.id}" class="absolute top-1 right-1 h-5 w-5 rounded-full bg-black/70 text-white text-[10px]">✕</button></div>`).join('')}<label class="rounded-[10px] border border-dashed border-[#ece8df] aspect-square grid place-items-center cursor-pointer text-[20px] text-[#8b897f]">+<input id="photoInput" type="file" accept="image/*" multiple class="hidden"></label></div>
          </div>

          <button id="savePost" class="mt-4 w-full h-[44px] rounded-[12px] bg-[#121210] text-white text-[14px] font-medium">Salvar postagem</button>
          ${editingId?`<button id="deletePost" class="mt-2 w-full h-[36px] rounded-[10px] border border-red-200 text-red-600 text-[12px]">Excluir</button>`:''}
        </div>
        `:''}

        <div class="space-y-2">
          ${filtered.map(p=>`
            <button data-edit="${p.id}" class="w-full text-left p-3 rounded-[12px] border ${editingId===p.id?'border-[#121210] bg-[#fffefb]':'border-[#ece8df] bg-white hover:border-[#d9d4ca]'} transition">
              <div class="flex justify-between items-start gap-2">
                <div class="text-[11px] text-[#8b897f]">${fmtDate(p.date)}</div>
                ${p.photos?.length?`<span class="text-[10px] bg-[#f4f1eb] px-1.5 py-0.5 rounded-full">📷 ${p.photos.length}</span>`:''}
              </div>
              <div class="mt-1 text-[13px] font-medium leading-[1.3] line-clamp-2">${p.title||'Sem título'}</div>
              <div class="mt-1 text-[12px] text-[#6a6863] line-clamp-2">${(p.text||'').slice(0,120)}</div>
              ${p.tags?.length?`<div class="mt-2 flex flex-wrap gap-1">${p.tags.map(t=>`<span class="px-1.5 py-0.5 rounded-full bg-[#fbf9f5] border border-[#ece8df] text-[10px]">#${t}</span>`).join('')}</div>`:''}
            </button>
          `).join('') || `<div class="py-10 text-center text-[13px] text-[#8b897f]">Nenhuma postagem encontrada para "${searchTerm||selectedTag}"</div>`}
        </div>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="flex-1 bg-[#fbf9f5] min-h-screen">
      <div class="sticky top-0 z-10 bg-[#fbf9f5]/90 backdrop-blur border-b border-[#ece8df]">
        <div class="max-w-[760px] mx-auto px-6 sm:px-10 py-4">
          <div class="relative">
            <input id="previewSearch" value="${searchTerm.replace(/"/g,'&quot;')}" placeholder="Localizar postagem no site..." class="w-full h-[46px] pl-11 pr-10 rounded-[14px] border border-[#ece8df] bg-white text-[14px] outline-none focus:border-[#121210]">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 opacity-60">🔍</span>
            ${searchTerm?'<button id="previewClear" class="absolute right-3 top-1/2 -translate-y-1/2 h-6 w-6 rounded-full bg-[#ece8df] grid place-items-center text-[10px]">✕</button>':''}
          </div>
          ${tags.length?`<div class="mt-3 flex flex-wrap gap-2">${tags.map(t=>`<button data-filtertag="${t.name}" class="px-3 py-1 rounded-full text-[11px] border ${selectedTag.toLowerCase()===t.name.toLowerCase()?'bg-[#121210] text-white border-[#121210]':'bg-white border-[#ece8df] text-[#6a6863] hover:border-[#121210]'}">#${t.name} (${t.count})</button>`).join('')} ${selectedTag?'<button id="previewClearTag" class="text-[11px] underline text-[#8b897f] ml-1">limpar</button>':''}</div>`:''}
          <div class="mt-2 text-[11px] text-[#8b897f]">${searchTerm||selectedTag?`${filtered.length} de ${state.posts.length} postagens encontradas`:`${state.posts.length} postagens • arquivo único, sem tracker`}</div>
        </div>
      </div>

      <div class="max-w-[760px] mx-auto px-6 sm:px-10 py-10 sm:py-14">
        <header class="mb-14 border-b border-[#ece8df] pb-10">
          <h1 class="font-serif-display text-[48px] sm:text-[64px] leading-[0.9] tracking-[-0.04em] max-w-[680px]">${state.siteTitle}</h1>
          <p class="font-serif-text text-[18px] sm:text-[20px] leading-[1.5] text-[#6a6863] mt-6 max-w-[520px]">${state.siteDesc}</p>
        </header>
        <div>
          ${filtered.length===0?`<div class="py-20 text-center text-[#8b897f] text-[14px]">Nenhuma postagem encontrada para "${searchTerm||selectedTag}"</div>`:filtered.map(p=>`
            <article class="mb-20 pb-16 border-b border-[#ece8df] last:border-0">
              <div class="text-[11px] tracking-[0.16em] uppercase text-[#8b897f] mb-3">${fmtDate(p.date)}</div>
              <h2 class="font-serif-display text-[32px] sm:text-[42px] leading-[0.98] tracking-[-0.03em] mb-5 max-w-[640px]">${p.title||'Sem título'}</h2>
              <div class="font-serif-text text-[17px] leading-[1.8] whitespace-pre-wrap max-w-[640px] text-[#2b2a28]">${p.text||''}</div>
              ${p.tags?.length?`<div class="mt-5 flex flex-wrap gap-2">${p.tags.map(t=>`<button data-previewtag="${t}" class="px-2.5 py-1 rounded-full bg-[#f4f1eb] border border-[#ece8df] text-[11px] hover:bg-[#121210] hover:text-white transition">#${t}</button>`).join('')}</div>`:''}
              ${p.photos?.length?`<div class="mt-8 grid gap-3 ${p.photos.length===1?'grid-cols-1':p.photos.length===2?'grid-cols-2':'grid-cols-3'}">${p.photos.map(ph=>`<figure class="m-0"><div class="overflow-hidden rounded-[12px] bg-[#f4f1eb] aspect-[4/3]"><img src="${ph.dataUrl}" class="w-full h-full object-cover"></div>${ph.caption?`<figcaption class="mt-2 text-[12px] text-[#8b897f]">${ph.caption}</figcaption>`:''}</figure>`).join('')}</div>`:''}
            </article>
          `).join('')}
        </div>
        <footer class="mt-20 pt-8 border-t border-[#ece8df] text-[11px] tracking-[0.06em] text-[#8b897f] flex gap-2 flex-wrap"><span>Feito com DriveSite Builder v2</span><span>·</span><span>com Busca e Tags</span><span>·</span><span>${new Date().getFullYear()}</span></footer>
      </div>
    </div>
  </div>
  `;

  // EVENTS
  document.getElementById('btnConfig')?.addEventListener('click',()=>{showConfig=!showConfig; renderApp()});
  document.getElementById('saveConfig')?.addEventListener('click',()=>{
    state.siteTitle=document.getElementById('siteTitle').value||'Seu título';
    state.siteDesc=document.getElementById('siteDesc').value||'';
    save(state); renderApp();
  });
  document.getElementById('btnNew')?.addEventListener('click',()=>{
    const id=uid();
    state.posts.unshift({id, date:new Date().toISOString(), title:'', text:'', tags:[], photos:[]});
    editingId=id; save(state); renderApp();
  });
  document.getElementById('searchInput')?.addEventListener('input', e=>{ searchTerm=e.target.value; renderApp(); document.getElementById('searchInput')?.focus(); });
  document.getElementById('previewSearch')?.addEventListener('input', e=>{ searchTerm=e.target.value; renderApp(); document.getElementById('previewSearch')?.focus(); });
  document.getElementById('clearSearch')?.addEventListener('click',()=>{ searchTerm=''; renderApp();});
  document.getElementById('previewClear')?.addEventListener('click',()=>{ searchTerm=''; renderApp();});
  document.getElementById('clearTag')?.addEventListener('click',()=>{ selectedTag=''; renderApp();});
  document.getElementById('previewClearTag')?.addEventListener('click',()=>{ selectedTag=''; renderApp();});

  document.querySelectorAll('[data-filtertag]').forEach(b=> b.addEventListener('click',()=>{ selectedTag = selectedTag.toLowerCase()===b.dataset.filtertag.toLowerCase()?'':b.dataset.filtertag; renderApp(); }));
  document.querySelectorAll('[data-previewtag]').forEach(b=> b.addEventListener('click',()=>{ selectedTag=b.dataset.previewtag; searchTerm=''; renderApp(); window.scrollTo({top:0,behavior:'smooth'}); }));
  document.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click',()=>{ editingId=b.dataset.edit; renderApp(); }));
  document.getElementById('cancelEdit')?.addEventListener('click',()=>{ editingId=null; renderApp(); });

  const tagInput=document.getElementById('tagInput');
  const addTag=()=>{
    if(!tagInput) return;
    let v=tagInput.value.trim().replace(/^#/,'').toLowerCase();
    if(!v) return;
    const post=state.posts.find(p=>p.id===editingId);
    if(!post) return;
    post.tags=post.tags||[];
    const exists=post.tags.some(t=>t.toLowerCase()===v.toLowerCase());
    if(!exists && v.length>=2){ post.tags.push(v); save(state); }
    tagInput.value=''; renderApp();
  };
  tagInput?.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===','){ e.preventDefault(); addTag(); }});
  document.getElementById('addTagBtn')?.addEventListener('click',addTag);
  document.querySelectorAll('[data-removetag]').forEach(b=> b.addEventListener('click',()=>{ const post=state.posts.find(p=>p.id===editingId); if(!post) return; post.tags=post.tags.filter(t=>t!==b.dataset.removetag); save(state); renderApp(); }));
  document.querySelectorAll('[data-suggest]').forEach(b=> b.addEventListener('click',()=>{ const post=state.posts.find(p=>p.id===editingId); if(!post) return; post.tags=post.tags||[]; if(!post.tags.some(t=>t.toLowerCase()===b.dataset.suggest.toLowerCase())){ post.tags.push(b.dataset.suggest); save(state); renderApp(); }}));

  document.getElementById('postTitle')?.addEventListener('input', e=>{ const p=state.posts.find(x=>x.id===editingId); if(p){ p.title=e.target.value; save(state);} });
  document.getElementById('postText')?.addEventListener('input', e=>{ const p=state.posts.find(x=>x.id===editingId); if(p){ p.text=e.target.value; save(state);} });

  document.getElementById('photoInput')?.addEventListener('change', async (e)=>{
    const files=[...e.target.files]; const post=state.posts.find(x=>x.id===editingId); if(!post) return;
    for(const file of files){ const dataUrl=await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); }); post.photos.push({id:uid(), dataUrl, caption:''}); }
    save(state); renderApp();
  });
  document.querySelectorAll('[data-removephoto]').forEach(b=> b.addEventListener('click',()=>{ const post=state.posts.find(p=>p.id===editingId); if(!post) return; post.photos=post.photos.filter(ph=>ph.id!==b.dataset.removephoto); save(state); renderApp(); }));

  document.getElementById('savePost')?.addEventListener('click',()=>{ save(state); editingId=null; renderApp(); });
  document.getElementById('deletePost')?.addEventListener('click',()=>{ if(confirm('Excluir esta postagem?')){ state.posts=state.posts.filter(p=>p.id!==editingId); editingId=null; save(state); renderApp(); }});

  document.getElementById('btnBackup')?.addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='backup.json'; a.click();
  });
  document.getElementById('importFile')?.addEventListener('change', async e=>{
    const file=e.target.files[0]; if(!file) return;
    const txt=await file.text(); try{ const data=JSON.parse(txt); if(data.posts){ state=data; if(!state.posts[0].tags) state.posts.forEach(p=>p.tags=p.tags||[]); save(state); renderApp(); } }catch{ alert('Arquivo inválido'); }
  });
  document.getElementById('btnExport')?.addEventListener('click',()=>{
    const html=exportDriveHtml();
    const blob=new Blob([html],{type:'text/html'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='index.html'; a.click();
  });
}

renderApp();
</script>
</body>
</html>
